<style>
/* Layout: one narrow column of stacked cards; three views (week → day → company) swapped in place, sticky top bar with home/back */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#14202B; --muted:#5D6B78; --line:#D7DEE5;
  --accent:#C8102E; --accent-soft:#FBE7EA; --chip:#E6EBF0;
  --ok:#1D7A4E; --ok-bg:#E2F3EA; --warn:#9A6400; --warn-bg:#FBF0D9; --bad:#A3283A; --bad-bg:#F8E3E6;
  --ghost-bg:#DCE3EA; --ghost-fg:#9AA8B5; --li:#0A66C2;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --card:#18222C; --ink:#E6ECF1; --muted:#97A5B2; --line:#2A3743;
  --accent:#FF5A6E; --accent-soft:#3A1B22; --chip:#22303C;
  --ok:#5FD39B; --ok-bg:#163126; --warn:#F2C062; --warn-bg:#352A12; --bad:#FF8A98; --bad-bg:#3A1B22; --ghost-bg:#2A3743; --ghost-fg:#6F8191; --li:#71B7FB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --card:#18222C; --ink:#E6ECF1; --muted:#97A5B2; --line:#2A3743;
  --accent:#FF5A6E; --accent-soft:#3A1B22; --chip:#22303C;
  --ok:#5FD39B; --ok-bg:#163126; --warn:#F2C062; --warn-bg:#352A12; --bad:#FF8A98; --bad-bg:#3A1B22; --ghost-bg:#2A3743; --ghost-fg:#6F8191; --li:#71B7FB; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff}
.bar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:17px;letter-spacing:.02em;line-height:1.2}
.brand span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px}
.nav button{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1)}
.nav button:active{background:rgba(255,255,255,.22)}
.nav svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* shared */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.din{background:var(--accent-soft);color:var(--accent)}
.code{font-family:var(--f-mono);font-weight:600;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* summary strip */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sum button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.sum .d{font-family:var(--f-display);font-size:20px;line-height:1}
.sum .w{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.sum .n{font-size:11.5px;color:var(--muted);margin-top:4px}
.sum button.today{border-color:var(--accent)}
.sum button.today .d{color:var(--accent)}

/* day card on home */
.day{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.day-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.day-h .dt{flex:1;min-width:0}
.day-h .big{font-family:var(--f-display);font-size:22px;line-height:1.1}
.day-h .big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);margin-left:6px}
.day-h .meta{font-size:12.5px;color:var(--muted)}
.sel{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px}
:root[data-theme="dark"] .sel{color:#1a0b0e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sel{color:#1a0b0e}}
.sel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.tag-today{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.slots{list-style:none;margin:0;padding:6px 0}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;text-align:left}
.slot:active{background:var(--chip)}
.slot .t{font-family:var(--f-mono);font-size:13.5px;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
.slot .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.slot .arr{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}

/* meeting card */
.mt{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mt:active{border-color:var(--accent)}
.mt .tc{flex:none;width:78px;padding:14px 0 14px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px dashed var(--line)}
.mt .tc .s{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mt .tc .e{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mt .tc .dur{font-size:11px;color:var(--muted);margin-top:auto}
.mt .bd{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mt .top{display:flex;align-items:flex-start;gap:8px}
.mt .co{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.3}
.kv{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;font-size:13.5px}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.kv dd .p{display:block}
.warnline{color:var(--warn)}
.mt .go{font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
.mt .go svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5}

/* company / profile */
.co-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.co-head .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co-head .nm{font-family:var(--f-display);font-size:22px;line-height:1.2}
.when{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.when-row{display:flex;gap:10px;font-size:13.5px;align-items:baseline}
.when-row .d{font-family:var(--f-mono);font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.when-row .l{color:var(--muted);min-width:0}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--muted)}
.note p{margin:0}
.person{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.person .row{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--ghost-bg);display:block}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:100%;height:100%;display:block;fill:var(--ghost-fg)}
.li{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--li);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.li b{display:grid;place-items:center;width:16px;height:16px;border-radius:3px;background:var(--li);color:var(--card);font-size:10px;font-family:Arial,sans-serif}
.person .who{flex:1;min-width:0}
.person .nm{font-weight:700;font-size:16.5px;line-height:1.3}
.person .ti{font-size:13.5px;color:var(--muted);margin-top:2px}
.st{flex:none}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.part{background:var(--warn-bg);color:var(--warn)}
.st.no{background:var(--bad-bg);color:var(--bad)}
.career{list-style:none;margin:14px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.career li{position:relative;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.career li::before{content:"";position:absolute;left:-19px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.career li:first-child::before{background:var(--accent);border-color:var(--accent)}
.career li.sub{color:var(--muted)}
.career li.sub::before{display:none}
.chg{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:6px}
.chip.chgc{background:var(--warn-bg);color:var(--warn)}
.chip.outc{background:var(--bad-bg);color:var(--bad);margin-top:6px}
.person.out .avatar,.person.out .career{opacity:.55}
.slot .lc{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.slot{align-items:flex-start}
.slot .t{padding-top:1px}
.empty{font-size:13.5px;color:var(--muted);margin-top:12px}
.foot{margin-top:24px;font-size:11.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const dur=(a,b)=>{const d=mins(b)-mins(a);return d>=60?(d/60)+"시간".replace(/^/,""):d+"분"};
const durTxt=(a,b)=>{const d=mins(b)-mins(a);const h=Math.floor(d/60),m=d%60;return (h?h+"h ":"")+(m?m+"m":"").trim()};
const kindChip=k=>k==="외부 미팅"?'<span class="chip">미팅</span>':`<span class="chip din">${esc(k)}</span>`;
const stChip=s=>!s?'<span class="chip st">상태 미기재</span>':s==="확인"?'<span class="chip st ok">확인</span>':s==="일부 확인"?'<span class="chip st part">일부 확인</span>':'<span class="chip st no">미확인</span>';
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const coLabel=ids=>ids.map(i=>CO[i].name).join(" & ");
let todayISO="";
try{todayISO=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date())}catch(e){}

/* ---------- views ---------- */
const app=document.getElementById("app");
let stack=[];
function go(v){stack.push(v);render()}
function back(){if(stack.length>1)stack.pop();render()}
function home(){stack=[{v:"home"}];render()}
document.getElementById("btnBack").onclick=back;
document.getElementById("btnHome").onclick=home;

function render(){
  const cur=stack[stack.length-1];
  document.getElementById("nav").hidden=cur.v==="home";
  const t=document.getElementById("barTitle"),s=document.getElementById("barSub");
  if(cur.v==="home"){t.textContent="TIACA ACF 2026";s.textContent="MIAMI · OCT 26–29 · LX PANTOS";app.innerHTML=homeView()}
  else if(cur.v==="day"){const d=DAYS.find(x=>x.id===cur.id);t.textContent=`${d.md} (${d.dow}) 일정`;s.textContent="MEETING SCHEDULE";app.innerHTML=dayView(d)}
  else{t.textContent=coLabel(cur.co);s.textContent="PROFILES";app.innerHTML=coView(cur.co)}
  app.firstElementChild&&app.firstElementChild.classList.add("view");
  window.scrollTo(0,0);
}

function homeView(){
  const total=DAYS.reduce((a,d)=>a+d.m.length,0);
  return `<div class="view">
  <div class="head"><span class="eyebrow">Air Cargo Forum · Meeting Board</span><h1 class="h1">전체 스케줄 · ${total}건</h1></div>
  <div class="sum">${DAYS.map(d=>`<button data-day="${d.id}" class="${d.date===todayISO?"today":""}"><div class="d">${d.id}</div><div class="w">${d.en} · ${d.dow}</div><div class="n">${d.m.length}건</div></button>`).join("")}</div>
  <div class="stack">${DAYS.map(d=>`
    <section class="day">
      <div class="day-h"><div class="dt"><div class="big">${d.md}<small>${d.dow}요일</small>${d.date===todayISO?'<span class="tag-today">TODAY</span>':""}</div><div class="meta">${d.m.length}건 · ${d.m[0].s}–${d.m[d.m.length-1].e}</div></div>
        <button class="sel" data-day="${d.id}">선택<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
      <ul class="slots">${d.m.map(m=>`<li><button class="slot" data-co="${m.co.join(",")}"><span class="t">${m.s}</span><span class="nm">${esc(m.t)}<span class="lc">${esc(m.loc&&m.loc!=="-"?m.loc:"장소 미정")}</span></span>${m.chg?'<span class="chip chgc">변경</span>':""}${m.k!=="외부 미팅"?kindChip(m.k):""}${m.co.length?ICON_ARR:'<span style="width:16px;flex:none"></span>'}</button></li>`).join("")}</ul>
    </section>`).join("")}</div>
  <p class="foot">기준: Meeting Profile list v5 · 2026.10.27 업데이트 · 현지(마이애미) 시간</p></div>`;
}

function meetingCard(m,showDate){
  return `<button class="mt" data-co="${m.co.join(",")}">
    <div class="tc"><span class="s">${m.s}</span><span class="e">~ ${m.e}</span><span class="dur">${durTxt(m.s,m.e)}</span></div>
    <div class="bd">
      <div class="top"><span class="co">${esc(m.t)}</span>${kindChip(m.k)}</div>${m.chg?`<span class="chg">${esc(m.chg)}</span>`:""}
      <dl class="kv">
        ${showDate?`<dt>Date</dt><dd class="mono">${showDate}</dd>`:""}
        <dt>Location</dt><dd class="${m.locWarn?"warnline":""}">${esc(m.loc)}</dd>
        <dt>Person</dt><dd>${m.who.map(w=>`<span class="p">${esc(w)}</span>`).join("")}</dd>
      </dl>
      ${m.co.length?`<span class="go">프로필 보기${ICON_GO}</span>`:""}
    </div></button>`;
}

function dayView(d){
  return `<div class="view">
  <div class="head"><span class="eyebrow">${d.en} · Meeting Schedule</span><h1 class="h1">${d.md} ${d.dow}요일 · ${d.m.length}건</h1></div>
  <div class="stack">${d.m.map(m=>meetingCard(m)).join("")}</div></div>`;
}

function coView(ids){
  const meets=[];DAYS.forEach(d=>d.m.forEach(m=>{if(m.co.some(c=>ids.includes(c)))meets.push({d,m})}));
  const sections=ids.map(id=>{const c=CO[id];return `
    <div class="co-head">
      <div class="ttl"><span class="nm">${esc(c.name)}</span>${c.code?`<span class="code">${esc(c.code)}</span>`:""}</div>
      ${c.note?`<div class="note">${c.note.map(n=>`<p>${esc(n)}</p>`).join("")}</div>`:""}
    </div>
    ${c.people.map(p=>`<article class="person${p.out?" out":""}">
      <div class="row"><div class="avatar">${PHOTOS[p.n]?`<img src="${PHOTOS[p.n]}" alt="${esc(p.n)}">`:GHOST}</div><div class="who"><div class="nm">${esc(p.n)}</div><div class="ti">${esc(p.t)}</div>${p.out?`<span class="chip outc">${esc(p.out)}</span>`:""}
        ${p.noLi?"":`<a class="li" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(p.n+' '+c.name)}" target="_blank" rel="noopener"><b>in</b>LinkedIn에서 찾기</a>`}</div></div>
      ${p.c.length?`<ul class="career">${p.c.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:`<p class="empty">${p.noLi?"참석자 이름이 확인되면 업데이트합니다.":"공개된 프로필 정보를 찾지 못했습니다."}</p>`}
    </article>`).join("")}`}).join("");
  return `<div class="view">
  <div class="head"><span class="eyebrow">Profiles</span><h1 class="h1">${esc(coLabel(ids))}</h1></div>
  <div class="stack">
    <div class="co-head"><span class="eyebrow">미팅 일정</span>
      <div class="when" style="margin-top:8px;padding-top:0;border-top:0">${meets.map(({d,m})=>`<div class="when-row"><span class="d">${d.md}(${d.dow}) ${m.s}–${m.e}</span><span class="l">${esc(m.loc)}${m.k!=="외부 미팅"?" · "+esc(m.k):""}</span></div>`).join("")}</div>
    </div>
    ${sections}
  </div></div>`;
}

app.addEventListener("click",e=>{
  const dayBtn=e.target.closest("[data-day]");
  if(dayBtn){go({v:"day",id:dayBtn.dataset.day});return}
  const coBtn=e.target.closest("[data-co]");
  if(coBtn&&coBtn.dataset.co){go({v:"co",co:coBtn.dataset.co.split(",")})}
});
home();
</script>
